# Reverse proxy in front of the API: single entry point, rate limit on the LLM endpoint.
limit_req_zone $binary_remote_addr zone=ask:10m rate=10r/m;

upstream api {
    server app:8000;
}

server {
    listen 80;
    client_max_body_size 1m;

    # Each question costs LLM calls: 10 per minute per client, small bursts allowed.
    location /api/ask {
        limit_req zone=ask burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://api;
        proxy_read_timeout 600s;  # corpus import can take minutes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
